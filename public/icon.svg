<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#16241d"/>
      <stop offset="100%" stop-color="#0c1319"/>
    </radialGradient>
    <linearGradient id="loopGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="loopTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bgClip">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGlow)"/>

  <g clip-path="url(#bgClip)">
    <!-- Ambient glow behind the mark -->
    <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>

    <!-- Infinity mark: two circles tangent at the center point (256,256),
         so they read as a single crossing "8" rather than a Venn overlap.
         The right (teal) loop is drawn last so it sits on top at the cross. -->
    <g filter="url(#softGlow)">
      <circle cx="178" cy="256" r="78" fill="none" stroke="url(#loopGreen)" stroke-width="40"/>
      <circle cx="334" cy="256" r="78" fill="none" stroke="url(#loopTeal)" stroke-width="40"/>
    </g>
  </g>
</svg>
