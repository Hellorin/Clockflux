<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlowLight" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f6f4"/>
    </radialGradient>
    <linearGradient id="loopGreenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="loopTealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="centerGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bgClipLight">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGlowLight)"/>
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="#e5e9e7" stroke-width="2"/>

  <g clip-path="url(#bgClipLight)">
    <!-- Ambient glow behind the mark, much subtler than the dark variant -->
    <circle cx="256" cy="256" r="180" fill="url(#centerGlowLight)"/>

    <!-- Infinity mark: two circles tangent at the center point (256,256).
         No glow filter here: the darker gradient stops carry contrast on
         a light background instead. -->
    <circle cx="178" cy="256" r="78" fill="none" stroke="url(#loopGreenLight)" stroke-width="40"/>
    <circle cx="334" cy="256" r="78" fill="none" stroke="url(#loopTealLight)" stroke-width="40"/>
  </g>
</svg>
