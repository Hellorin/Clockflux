<!DOCTYPE html>
<html>
<head><style>*{margin:0;padding:0;overflow:hidden}</style></head>
<body>
<canvas id="c"></canvas>
<script>
const svgDark = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#16241d"/>
      <stop offset="100%" stop-color="#0c1319"/>
    </radialGradient>
    <linearGradient id="loopGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="loopTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bgClip">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGlow)"/>
  <g clip-path="url(#bgClip)">
    <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>
    <g filter="url(#softGlow)">
      <circle cx="178" cy="256" r="78" fill="none" stroke="url(#loopGreen)" stroke-width="40"/>
      <circle cx="334" cy="256" r="78" fill="none" stroke="url(#loopTeal)" stroke-width="40"/>
    </g>
  </g>
</svg>`;

const svgLight = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlowLight" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f6f4"/>
    </radialGradient>
    <linearGradient id="loopGreenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="loopTealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="centerGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bgClipLight">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGlowLight)"/>
  <rect width="512" height="512" rx="110" ry="110" fill="none" stroke="#e5e9e7" stroke-width="2"/>
  <g clip-path="url(#bgClipLight)">
    <circle cx="256" cy="256" r="180" fill="url(#centerGlowLight)"/>
    <circle cx="178" cy="256" r="78" fill="none" stroke="url(#loopGreenLight)" stroke-width="40"/>
    <circle cx="334" cy="256" r="78" fill="none" stroke="url(#loopTealLight)" stroke-width="40"/>
  </g>
</svg>`;

const params = new URLSearchParams(location.search);
const SIZE = parseInt(params.get('size') || '512');
const theme = params.get('theme') || 'dark';
const svg = theme === 'light' ? svgLight : svgDark;
const c = document.getElementById('c');
c.width = SIZE; c.height = SIZE;
c.style.width = SIZE + 'px'; c.style.height = SIZE + 'px';
const ctx = c.getContext('2d');
const blob = new Blob([svg], {type:'image/svg+xml'});
const url = URL.createObjectURL(blob);
const img = new Image();
img.onload = () => { ctx.drawImage(img, 0, 0, SIZE, SIZE); URL.revokeObjectURL(url); document.title='ready'; };
img.src = url;
</script>
</body>
</html>
