# Dependency updates. Nothing automated existed before this: the only scanning
# was `npm audit`/`govulncheck` inside CI, which only ever ran when somebody
# happened to push — so an advisory published on a quiet week went unnoticed
# until the next commit.
#
# Grouped and weekly on purpose. Ungrouped daily PRs are the fastest way to
# make dependency updates something everyone learns to ignore.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps land together; a major gets its own PR, because
      # that is the one that needs a human to read a changelog.
      all-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The workflows themselves are a supply-chain surface too — fly-deploy.yml
  # runs an action in the same job that holds FLY_API_TOKEN.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
