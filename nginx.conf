server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Mirrors vercel.json's header block — see SECURITY-REVIEW.md M3. Without
    # these, this deploy path (nginx/Docker) shipped with zero security
    # headers, unlike the Vercel deploy which at least has this set (modulo
    # the unresolved connect-src placeholder, tracked separately as M2).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-GpJr5oDOCXyfg8O0uUp38fy/TuLt5V8yXVWZj4ET7AA=' https://accounts.google.com/gsi/client; style-src 'self'; img-src 'self' https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://clockflux-backend.fly.dev https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The marketing/about page moved to clockflux-info-front — mirrors
    # vercel.json's redirect for this deploy path too.
    location = /about {
        return 301 https://info.clockflux.app/;
    }

    location /about/ {
        return 301 https://info.clockflux.app/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        # nginx's add_header doesn't inherit into a location block that
        # defines its own add_header — so without repeating the security
        # headers here, every request under /assets/ would silently lose
        # them.
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-GpJr5oDOCXyfg8O0uUp38fy/TuLt5V8yXVWZj4ET7AA=' https://accounts.google.com/gsi/client; style-src 'self'; img-src 'self' https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://clockflux-backend.fly.dev https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}